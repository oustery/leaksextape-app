name: Build APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.19.6'

jobs:
  build:
    name: Build Release & Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify Flutter setup
        run: |
          flutter --version
          echo "Flutter SDK location:"
          which flutter

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK  
        id: build_debug
        run: |
          echo "=== Starting Debug Build ==="
          flutter build apk --debug --target-platform android-arm64
          echo "=== Debug build completed ==="
          
          # Check if APK was created
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "✅ Debug APK found!"
            ls -lh build/app/outputs/flutter-apk/app-debug.apk
            echo "debug_apk_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Debug APK not found at expected location"
            echo "Looking for any APK files..."
            find . -name "*.apk" 2>/dev/null || echo "No APKs anywhere"
            echo "debug_apk_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK (if debug succeeded)
        if: success()
        id: build_release
        run: |
          echo "=== Starting Release Build ==="
          flutter build apk --release --target-platform android-arm64
          echo "=== Release build completed ==="
          
          # Check if APK was created
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "✅ Release APK found!"
            ls -lh build/app/outputs/flutter-apk/app-release.apk
            echo "release_apk_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Release APK not found at expected location"
            find . -name "*.apk" 2>/dev/null || echo "No APKs anywhere"
            echo "release_apk_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: List ALL build outputs
        if: always()
        run: |
          echo "==========================================="
          echo "       COMPLETE BUILD OUTPUT SCAN         "
          echo "==========================================="
          echo ""
          echo "--- All APK files in project ---"
          find . -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null || echo "⚠️ No APK files found anywhere!"
          echo ""
          echo "--- Build output directory structure ---"
          if [ -d "build" ]; then
            find build -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | head -20
            echo ""
            echo "--- Full directory listing of outputs ---"
            ls -laR build/app/outputs/ 2>/dev/null || echo "⚠️ build/app/outputs/ not found"
            ls -laR build/app/outputs/flutter-apk/ 2>/dev/null || echo "⚠️ flutter-apk dir not found"
          else
            echo "⚠️ build directory does not exist!"

      # Upload Debug APK - use exact path where Flutter creates it
      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaksextape-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: ignore

      # Upload Release APK - use exact path where Flutter creates it
      - name: Upload Release APK Artifact  
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaksextape-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      # Fallback: Upload ANY APK files found anywhere
      - name: Upload Any Found APKs (Fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-found-apks
          pattern: '**/*.apk'
          retention-days: 30
          if-no-files-found: ignore
