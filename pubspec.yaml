name: leaksextape_app
description: Video streaming app for LeakSexTape
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # HTTP & Networking
  http: ^1.2.0
  
  # HTML Parsing  
  html: ^0.15.4
  
  # Video Player
  video_player: ^2.8.3
  chewie: ^1.7.1
  
  # WebView (for embed video support)
  webview_flutter: ^4.4.2
  
  # URL Launcher (for sharing/opening links)
  url_launcher: ^6.2.1
  
  # State Management
  provider: ^6.0.5
  
  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0+1
  
  # UI Components
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Override incompatible packages for Flutter 3.19.6 compatibility
dependency_overrides:
  chewie: 1.7.5
  video_player: 2.8.6

flutter:
  uses-material-design: true
  
  # Note: assets/fonts will be added when font files are available
  # Currently using system fonts to avoid build errors
